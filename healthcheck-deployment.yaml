apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-healthcheck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-healthcheck
  template:
    metadata:
      labels:
        app: hello-healthcheck
    spec:
      containers:
        - name: hello
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
